name: Release

# Push a tag `vX.Y.Z` that matches the version in Cargo.toml. The action downloads the binary
# from the release with that version.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  binaries:
    needs: create
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build
        run: nix build .#rustdoc-wiki-static --print-build-logs
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=rustdoc-wiki-${{ matrix.arch }}-linux.tar.gz
          tar -C result/bin -czf "$asset" rustdoc-wiki
          gh release upload "$GITHUB_REF_NAME" "$asset"

  # `uses: ...@v0` follows the newest 0.x release. The action finds its binary from the version in
  # Cargo.toml at the commit the tag points to, so the moving tag needs no release of its own.
  major-tag:
    needs: binaries
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the major version tag
        run: |
          major=${GITHUB_REF_NAME%%.*}
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
