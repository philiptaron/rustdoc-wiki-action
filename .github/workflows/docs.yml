name: Docs

# This repository documents itself in its own wiki, with its own action.
on:
  push:
    branches: [lex]
  release:
    types: [published]
  workflow_dispatch:

# One wiki, one writer at a time.
concurrency:
  group: wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          # The default branch is `latest`; a release also gets a frozen snapshot.
          version: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
