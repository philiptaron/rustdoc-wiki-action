name: CI

on:
  push:
    branches: [lex]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # The unit and end-to-end tests on the pinned nightly, and the check that the nightly and
      # `rustdoc-types` agree on the JSON format version.
      - run: nix flake check --print-build-logs

      # The binary the action downloads. Building it fails if a /nix/store path leaks into it.
      - run: nix build .#rustdoc-wiki-static --print-build-logs

      - name: The static binary runs without Nix
        run: |
          file result/bin/rustdoc-wiki
          # `env -i` drops PATH and everything else Nix could have provided.
          env -i result/bin/rustdoc-wiki format-version
